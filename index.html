<style>
:root{--bg:#f4f7fa;--card:#fff;--ink:#0c2233;--mut:#586b7b;--line:#dbe5ee;--acc:#9a3f35;--accfg:#fff;--sos:#d9482b;--soft:#e4eff6;--warn:#fff3df;color-scheme:light;

.hero h1{font-family:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",Georgia,serif;font-size:24px;margin:0 0 6px}
.hero p{margin:0;opacity:.92;font-size:15px}
.back{background:none;border:0;color:var(--acc);font-weight:700;padding:8px 0;font-size:15px}
.mind{font-family:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",Georgia,serif;font-size:22px;line-height:1.5;background:var(--soft);border-left:5px solid var(--acc);border-radius:10px;padding:16px;margin:8px 0 4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.say{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:17px;font-weight:500}
ul.l{margin:0;padding-left:20px}ul.l li{margin-bottom:6px}
.tag{display:inline-block;font-size:12px;background:var(--warn);border-radius:6px;padding:1px 8px;margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:8px 2px 10px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}

textarea{width:100%;min-height:90px;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
label.c{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
label.c input{margin-top:5px;width:18px;height:18px;accent-color:var(--acc)}
.pr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.pr b{display:block;margin-bottom:2px}
.warn{background:var(--warn);border-radius:12px;padding:14px;margin-bottom:10px}
.my{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}.my summary{font-weight:700;cursor:pointer}.my p{margin:10px 0 0}.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px}.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}a{color:var(--acc);font-weight:700}

</style>

입이라고 말합니다.", "mind": "나는 오늘 먼저 예입한다.", "say": ["좋은 아침이야. 오늘도 고마워.", "오늘 하루 잘 보내. 이따 봐."], "do": ["아침 인사와 함께 눈 맞추기", "고마운 일 하나를 말로 하기", "안아 주기"], "extra": false}], "myths": [{"title": "배우자만 바뀌면 우리는 행복해진다", "body": "책은 불행한 부부가 불행의 원인을 배우자에게서 찾는 경향이 있다고 봅니다. 결혼의 성공은 맞는 사람을 찾는 데 있기보다 내가 결혼한 사람에게 적응하는 능력에 달려 있다고 설명합니다. 결혼생활은 배우자를 바꾸는 일이 아니라 나를 바꾸는 평생의 작업이라는 것이 책의 관점입니다.", "ask": "이번 갈등에서 내가 바꿀 수 있는 것은 무엇이었나?"}, {"title": "돈을 많이 벌어다 주면 가족은 행복하다", "body": "책은 부유함과 행복을 같은 것으로 보는 공식에 의문을 제기합니다. 돈은 생활의 수단일 뿐 목적이 아니며, 돈으로 침대는 살 수 있어도 잠은 살 수 없고 집은 살 수 있어도 가정은 살 수 없다고 말합니다.", "ask": "가족은 나의 월급과 나의 시간 중 무엇을 더 기다리고 있을까?"}, {"title": "말하지 않아도 마음은 통한다", "body": "책은 이심전심은 없다고 봅니다. 한 실험에서 연주자는 듣는 사람이 곡을 절반쯤 맞힐 것이라 예상했지만 실제로는 극히 일부만 맞혔다는 사례를 소개합니다. 말하지 않은 마음은 상대에게 거의 전달되지 않는다는 뜻입니다.", "ask": "내가 말하지 않고 알아주기를 바란 것이 있었나?"}, {"title": "부부싸움은 관계의 위기다", "body": "책은 이혼하는 부부가 자주 싸우거나 아예 싸우지 않는 경우가 많다고 보며, 건강한 부부는 가끔 싸우지만 잘 해결하는 부부라고 합니다. 싸움의 이면에는 가까워지고 싶은 욕구가 있을 수 있고, 완벽히 화해하면 오히려 관계가 단단해진다고 말합니다.", "ask": "이 다툼 뒤에 상대가 바라는 것은 무엇일까?"}, {"title": "안 맞으면 헤어지는 것이 답이다", "body": "책은 이혼의 근본 이유를 성격차이 같은 사유가 아니라 친밀감의 부재로 보고, 그것들은 원인이 아니라 증상이라고 설명합니다. 이혼 뒤 많은 사람이 고독감과 자녀 문제에 시달리고 결혼생활을 더 잘했으면 하고 후회한다고 전합니다. 이는 책의 주장이며 모든 관계에 해당하지는 않습니다.", "ask": "지금의 문제는 친밀감이 낮아져서 커진 것은 아닐까?"}, {"title": "감사와 사과는 부부 사이에 새삼스럽다", "body": "책은 감사도 쓰지 않으면 퇴화하는 기능이라고 봅니다. 사소한 일에 감사를 표현하는 습관이 감정은행계좌에 큰 예입이 되고, 갈등이 잦은 부부일수록 사과가 없다고 지적합니다.", "ask": "오늘 배우자에게 마지막으로 고맙다고 한 것은 언제인가?"}, {"title": "실수는 지적해야 고쳐진다", "body": "책은 지적받은 사람이 자신을 바보라 여기며 같은 실수를 반복하게 된다고 봅니다. 상황을 이해해 주는 말이 배우자가 자신을 탓하지 않고 다시 시도하게 돕는다고 합니다.", "ask": "내 지적은 상대를 돕고 있었나, 위축시키고 있었나?"}, {"title": "좋은 사람을 골랐으니 알아서 행복해진다", "body": "책은 결혼 후 환상이 깨지는 단계를 지나야 참사랑에 이른다고 봅니다. 결혼의 성패는 맞는 사람을 발견하는 데보다 결혼한 사람에게 적응하는 능력에 달려 있다고 설명합니다. 행복한 부부도 완벽한 것이 아니라 서로를 인정하고 격려하고 용서하는 것이 생활화되어 있다고 말합니다.", "ask": "나는 처음의 환상이 아니라 지금의 사람에게 적응하고 있나?"}, {"title": "사랑은 감정이 있을 때 하는 것이다", "body": "책은 사랑은 결심이 아니라 실천이라고 봅니다. 내가 좋아하는 것을 포기하고 상대가 좋아하는 것을 해 주는 것이 사랑이며, 상대의 잘못을 용서하는 것이 사랑의 절정이라고 합니다.", "ask": "감정이 없어도 오늘 할 수 있는 사랑의 행동은 무엇인가?"}, {"title": "같이 살면 배우자를 이미 잘 안다", "body": "책은 의외로 우리가 배우자를 잘 모른다고 봅니다. 배우자의 과거, 기질, 남녀의 차이를 공부하고, 결혼생활 관련 도서를 함께 읽으며 대화하라고 권합니다.", "ask": "배우자의 어린 시절 이야기를 마지막으로 들은 것은 언제인가?"}, {"title": "다툰 뒤 몸으로 풀면 화해가 된 것이다", "body": "책은 부부싸움이 풀리지 않은 채 끝나는 경우가 많아, 그 상태에서 관계를 요구하면 상대의 마음이 닫힌다고 봅니다. 사과와 대화로 완전히 화해한 뒤라야 마음과 몸이 함께 열린다고 설명합니다.", "ask": "상대는 마음이 열린 상태였나, 아니면 맞춰 주고 있었나?"}, {"title": "편들어 줄 사람을 불러야 싸움에서 이긴다", "body": "책은 부부싸움 뒤 가족을 지원군으로 부르면 결혼이 여섯 사람의 일이 된다고 봅니다. 아무리 가까운 사람이라도 개입시키지 말고, 화해도 이혼도 두 사람이 하라고 합니다.", "ask": "지금 내 이야기를 먼저 들어야 할 사람은 누구인가?"}, {"title": "부부가 화목하든 말든 아이만 잘 키우면 된다", "body": "책은 부부관계가 좋은 가정의 자녀가 심리적 안정감으로 공부도 잘한다고 봅니다. 아이들은 부모가 서로를 대하는 모습을 보고 결혼관을 배우며, 무시당하는 부모를 보고 자란 아이는 자존감이나 관계에 어려움을 겪기 쉽다고 합니다.", "ask": "아이는 오늘 내가 배우자를 대하는 모습에서 무엇을 배웠을까?"}, {"title": "무엇을 말하느냐가 가장 중요하다", "body": "책은 부부가 이혼하는 이유가 싸움의 내용이 아니라 싸우는 방식 때문이라고 봅니다. 한 심리학 연구는 말의 내용보다 목소리와 몸짓의 영향이 훨씬 크다고 소개합니다. 같은 말도 어떻게 하느냐에 따라 달라집니다.", "ask": "내 목소리와 표정은 내 말과 같은 메시지를 주고 있었나?"}], "gains": [{"title": "두터운 감정은행계좌", "body": "책은 부부 사이에 매일 작은 예입을 하면 갈등이나 오해로 인한 인출을 견딜 수 있다고 봅니다. 행복한 부부의 긍정과 부정 비율이 5대 1이라는 연구를 소개합니다.", "line": "다툰 날 밤에도, 쌓아 둔 고마움이 먼저 떠오른다."}, {"title": "안정된 아이들", "body": "책은 부부관계가 좋은 가정의 자녀가 심리적 안정감을 얻어 학습에도 도움이 된다고 봅니다. 아이들은 부모의 갈등 해결 방식을 보고 배웁니다.", "line": "아이가 부모가 웃으며 화해하는 모습을 본다."}, {"title": "함께 쌓는 추억", "body": "책은 행복을 추억 만들기라고 말합니다. 힘든 시기에도 부부가 함께 쌓은 행복의 조각이 서로를 지탱해 준다고 합니다.", "line": "힘든 날, 같이 넘겨 보는 추억의 앨범이 있다."}, {"title": "몸과 마음의 건강", "body": "책은 결혼 만족도가 높은 부부가 면역과 수명에서도 유리하다는 연구들을 소개합니다. 이는 책이 전하는 연구이며 개인 건강은 의료진과 상의해야 합니다.", "line": "하루의 끝, 배우자와 나누는 5분의 대화가 마음을 가라앉힌다."}, {"title": "서로의 유일한 존재", "body": "책은 아이가 자란 뒤 결국 곁에 남는 사람은 배우자라고 봅니다. 서로에게 유일한 존재가 되겠다는 결혼 서약의 의미를 되새기라고 합니다.", "line": "자녀가 독립한 집, 마주 앉아 차를 마시는 두 사람이 있다."}, {"title": "말할 수 있는 때를 놓치지 않는 삶", "body": "책은 사랑한다는 말에도 때가 있다고 합니다. 때를 놓치고 후회하기 전에 지금 전하라고 권합니다.", "line": "오늘 저녁, 미뤄 둔 한마디를 말했다."}, {"title": "화목한 가정의 모습", "body": "책은 화목한 가정의 특징으로 구성원의 자기 가치가 높고, 의사소통이 직접적이며, 역할 분담이 분명하고, 규칙에 융통성이 있으며, 바깥과의 관계가 열려 있는 것을 꼽습니다.", "line": "식탁에서 누구나 자기 이야기를 편하게 한다."}, {"title": "용서가 주는 가벼움", "body": "책은 사랑의 절정이 용서라고 봅니다. 상대를 원망하고 싶을 때 용서를 택하면 관계가 풀리고 내 마음도 가벼워진다고 합니다.", "line": "묵은 서운함을 내려놓은 저녁, 마음이 가볍다."}, {"title": "감사하는 눈", "body": "책은 감사도 쓰지 않으면 퇴화하는 기능이고 습관이라고 봅니다. 찾아보면 감사할 일이 많다고 말합니다.", "line": "하루가 끝날 때 감사한 일 세 가지가 떠오른다."}, {"title": "서로를 성장시키는 관계", "body": "책은 우리가 자신을 완성하기 위해 다른 사람이 필요하다고 봅니다. 혼자서는 이룰 수 없는 부부의 친밀감을 인간관계의 극치라고 부릅니다.", "line": "배우자 덕분에 내가 조금 나아졌다는 것을 느낀다."}, {"title": "충족감 있는 친밀함", "body": "책은 부부 사이의 좋은 친밀함이 횟수나 기술이 아니라 충족감과 마음의 연결에 달려 있다고 봅니다. 서로 필요를 이야기하고 날을 정해 준비하는 부부가 만족을 얻는다고 말합니다.", "line": "서로 눈을 보고 웃는 것이 자연스러워졌다."}], "rules": [{"title": "나를 바꾼다", "body": "문제의 초점을 배우자가 아니라 나에게 둡니다. 나에 대해 공부하고, 배우자의 과거와 기질, 남녀의 차이도 배웁니다."}, {"title": "이 결혼은 우리를 위한 것이다", "body": "각자 나를 위한 결혼이라 생각하면 충돌합니다. 우리 가정에 유익한 쪽을 함께 택합니다."}, {"title": "긍정과 부정의 비율은 5대 1", "body": "관계의 균형은 긍정 표현이 부정보다 훨씬 많을 때 유지됩니다. 칭찬, 감사, 스킨십을 의식적으로 늘립니다."}, {"title": "미안해, 고마워, 사랑해를 말한다", "body": "가장 쉬우면서 가장 큰 힘을 가진 세 말을 두려움과 부끄러움 없이 건넵니다."}, {"title": "공감한 뒤에 내 이야기를 한다", "body": "공감적 경청, 공감적 반영, 나 전달법의 순서를 지킵니다. 표현은 부드럽게, 뜻은 분명하게 전합니다."}, {"title": "싸움의 목적은 회복이다", "body": "끝장을 보려 하지 않고, 아픈 말은 삼가며, 그날 안에 풉니다. 제3자를 끌어들이지 않습니다."}, {"title": "큰 결정은 함께한다", "body": "돈과 이사, 자녀 문제 같은 큰 결정은 같이 상의하고 책임도 같이 집니다."}, {"title": "기록으로 나를 본다", "body": "감정이 올라올 때의 날짜, 상황, 느낌, 깨달은 점을 적어 패턴을 확인합니다."}, {"title": "하루에 한 번 안아 준다", "body": "책은 포옹을 신체로 전하는 가장 따뜻한 말이라고 봅니다. 서로 동의하는 방식으로 자주 안아 줍니다."}, {"title": "가정은 경영하는 것이다", "body": "회사에 쓰는 시간의 일부만 가정에 써도 회복 효과가 크다고 봅니다. 가정 경영은 투자 대비 돌아오는 것이 큰 영역입니다."}, {"title": "감사는 습관이다", "body": "작은 일에도 고마움을 표현하는 습관을 들입니다. 도움을 받은 쪽이 감사하면 도와준 쪽의 마음도 열립니다."}, {"title": "용서가 사랑의 절정이다", "body": "상대의 잘못 앞에서 용서를 택합니다. 용서하는 쪽이 먼저 자유로워진다고 봅니다."}, {"title": "3그 대화법을 쓴다", "body": "그렇구나, 그래?, 그래서 어떻게 됐어?로 상대 말을 이어 가며 듣습니다. 먼저 상대 감정을 인정하고 되돌려 줍니다."}, {"title": "말보다 목소리와 몸짓도 말이다", "body": "표정, 목소리, 자세가 말의 내용보다 크게 전달됩니다. 같은 말도 부드럽게 전합니다."}, {"title": "10분 노트로 감정을 나눈다", "body": "각자 10분 동안 감정을 노트에 쓰고 바꿔 읽은 뒤 10분 대화합니다. 상대 감정을 몰아붙이지 않고 공감하며 되돌려 줍니다."}, {"title": "싸움 다섯 원칙", "body": "주제에만 싸우고, 이성을 잃지 않으며, 아픈 말은 삼가고, 사과할 것은 사과하고, 오래 끌지 않습니다."}, {"title": "다툼 중에도 지킬 약속을 정한다", "body": "문제가 풀리기 전에는 떨어지지 않기, 집에 누구도 들이지 않기, 다툰 채로 외출하지 않기 같은 규칙을 미리 합의합니다."}, {"title": "각방을 쓰지 않는다", "body": "아무리 화가 나도 그날 끝내고 각방을 쓰지 않습니다. 나가야 한다면 산책처럼 돌아올 약속을 하고 나갑니다."}, {"title": "겉이 아닌 이면을 읽는다", "body": "겉으로 하는 요구 뒤에는 걱정, 섭섭함, 친밀해지고 싶은 마음이 있을 수 있습니다. 그것을 물어봅니다."}, {"title": "부부의 날을 정한다", "body": "바쁜 일상에서 친밀한 시간이 밀리지 않도록 미리 날을 정하고, 그날을 위해 각자 일을 미리 챙깁니다."}, {"title": "내 편이라고 부른다", "body": "배우자를 ‘내 편’이라 부르고 기대를 담아 말합니다. 존중받는 사람은 기대에 맞게 변하려 합니다."}, {"title": "가정은 모든 것을 걸고 지킨다", "body": "가정은 돈으로 살 수 없는 가치입니다. 내게 다소 불이익이 있어도 우리 가정에 유익하다면 나를 내려놓습니다."}], "stories": [{"title": "전역 약속을 지킨 지휘관", "body": "고위 군 지휘관이 더 높은 직책을 제안받았지만, 결혼 초 아내와 한 약속을 지켜 전역하고 가족 곁으로 돌아가는 길을 택했다고 합니다.", "line": "약속을 지키는 일이 가장 큰 사랑의 표현일 수 있다."}, {"title": "아내를 알아보는 총장", "body": "아내가 자신을 알아보지 못하는 상황에서도 간병인을 두고 일에 전념하라는 권유에, 아내는 나를 몰라봐도 나는 아내를 알아본다고 답한 대학 총장의 이야기입니다.", "line": "사랑은 돌려받는 것이 아니라 지키는 것이다."}, {"title": "시어머니 앞에서 마음을 바꾼 아내", "body": "봉사 활동을 다니던 아내가 시어머니를 먼저 섬기는 것이 순서가 아니냐는 생각에 이르러 용서를 구했고, 시어머니는 변하지 않았지만 갈등이 사라졌다고 합니다.", "line": "상대가 변하지 않아도 내 마음이 달라지면 관계가 달라진다."}, {"title": "수첩에 적은 짜증", "body": "한 남편이 짜증이 날 때마다 상황과 감정을 수첩에 기록했더니 자신의 패턴을 알게 되었고, 약 3개월 뒤 짜증이 현저히 줄었다고 합니다.", "line": "기록은 나를 비난하는 도구가 아니라 직시하는 도구다."}, {"title": "다섯 가지 부부 규칙", "body": "한 부부는 문제가 풀리기 전에는 떨어지지 않고, 문제가 있을 때 집에 누구도 들이지 않으며, 완전히 풀릴 때까지 외출하지 않는 등의 규칙을 정했다고 합니다.", "line": "싸움을 줄이는 것보다 회복하는 규칙을 먼저 정한다."}, {"title": "말할 사람이 없어진 뒤의 후회", "body": "한 아버지는 아내에게 평생 마음을 표현하지 못했고 이제는 무슨 말이든 할 수 있는데 들을 사람이 없다고 했다고 합니다.", "line": "오늘 못 한 말은 내일의 후회가 될 수 있다."}, {"title": "시간 지키기에서 풀어 준 편지", "body": "시간을 지키는 문제로 아내를 오래 힘들게 했다고 느낀 한 남편이 생일에 이제 그 일에서 자유로워져도 좋다는 편지를 썼고, 아내는 최고의 선물이라며 기뻐했다고 합니다.", "line": "상대를 고치려던 마음을 내려놓는 것이 가장 큰 선물일 수 있다."}, {"title": "할 수 있지만 해서는 안 되는 일", "body": "책은 권력과 힘이 있다고 해서 무엇이든 해도 star:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21.1 7 14.2 2 9.3l6.9-1z"/>',
moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',
flag:'<path d="M4 21V4M4 4h12l-2 4 2 4H4"/>',
bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'};
const ic=(k,z=24)=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]||IC.shield}</svg>`;
const L=Object.assign({today:"오늘",sos:"지금 대응",learn:"이해",story:"기록",help:"전문 도움",myths:"진실 확인",gains:"되찾는 것들",rules:"원칙",dailyLabel:"오늘의 선언",truthHeading:"오늘의 진실",pledgeHeading:"나의 결단문",pledgePlaceholder:"",checklistHeading:"사전 점검",checklistReset:"점검 초기화",sosLabel:"지금 대응",sosTitle:"",sosText:"",sosCta:"",sosFooter:"",back:"‹ 목록",bookHeading:"책의 관점",mindHeading:"마음속 선언",sayHeading:"그 자리에서 할 말",doHeading:"행동 지침",extraTag:"책 밖 조언",mythsTitle:"진실 확인",mythsIntro:"",askPrefix:"스스로에게 묻기: ",gainsTitle:"되찾는 것들",gainsIntro:"",rulesTitle:"핵심 원칙",rulesIntro:"",storyTitle:"사례",storyIntro:"",logTitle:"나의 기록",logIntro:"",logPlaceholder:"",logAdd:"기록하기",logDelete:"삭제",logCopy:"전체 복사",logCopied:"복사했습니다",logNote:"기록은 이 기기에만 저장되며 서버로 전송되지 않습니다.",helpTitle:"전문 도움"},C.labels||{});
const A=k=>Array.isArray(C[k])?C[k]:[];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=document.getElementById("app"),nav=document.getElementById("nav");
let tab="today",cur=null,sub=null;
function sg(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const day=()=>Math.floor(Date.now()/864e5);
const subs=()=>[["myths",L.mythsTitle],["gains",L.gainsTitle],["rules",L.rulesTitle]].filter(a=>A(a[0]).length);
const tabs=()=>[["today",L.today,"sun"],A("situations").length&&["sos",L.sos,"shield"],subs().length&&["learn",L.learn,"book"],(A("stories").length||C.logEnabled)&&["story",L.story,"note"],C.help&&["help",L.help,"buoy"]].filter(Boolean);
function today(){
 const d=day(),D=A("daily"),M=A("myths"),CK=A("checklist"),ck=JSON.parse(sg("ck","[]")),m=M.length?M[d%M.length]:null;
 return (D.length?`<div class="hero"><div class="lab">${esc(L.dailyLabel)}</div><p class="stmt">${esc(D[d%D.length])}</p></div>`:"")+
 (A("situations").length?`<button class="sit" data-go="sos"><span class="i">${ic("shield")}</span><span><b>${esc(L.sos)}</b><span class="mut">${esc(L.sosCta)}</span></span></button>`:"")+
 (m?`<h2>${esc(L.truthHeading)}</h2><div class="box"><b>${esc(m.title)}</b><p>${esc(m.body)}</p></div>`:"")+
 `<h2>${esc(L.pledgeHeading)}</h2><textarea id="pl" placeholder="${esc(L.pledgePlaceholder)}">${esc(sg("pl",""))}</textarea>`+
 (CK.length?`<h2>${esc(L.checklistHeading)}</h2>`+CK.map((c,n)=>`<label class="c"><input type="checkbox" data-c="${n}" ${ck.includes(n)?"checked":""}><span>${esc(c)}</span></label>`).join("")+`<button class="back" id="rs">${esc(L.checklistReset)}</button>`:"");
}
function sos(){
 const S=A("situations");
 if(cur===null)return `<div class="hero"><div class="lab">${esc(L.sosLabel)}</div><h1>${esc(L.sosTitle)}</h1><p>${esc(L.sosText)}</p></div>`+
  S.map((s,n)=>`<button class="sit" data-n="${n}"><span class="i">${ic(s.icon)}</span><span><b>${esc(s.title)}</b><span class="mut">${esc(s.sub)}</span></span></button>`).join("")+(L.sosFooter?`<p class="mut">${esc(L.sosFooter)}</p>`:"");
 const s=S[cur],say=s.say||[],dos=s.do||[];
 return `<button class="back" id="bk">${esc(L.back)}</button><h1>${esc(s.title)}</h1>`+
 (s.book?`<h2>${esc(L.bookHeading)}</h2><div class="box">${esc(s.book)}</div>`:"")+
 (s.mind?`<h2>${esc(L.mindHeading)}</h2><div class="mind">“${esc(s.mind)}”</div>`:"")+
 (say.length?`<h2>${esc(L.sayHeading)}</h2>`+say.map(x=>`<div class="say">“${esc(x)}”</div>`).join(""):"")+
 (dos.length?`<h2>${esc(L.doHeading)}</h2>${s.extra?`<span class="tag">${esc(L.extraTag)}</span>`:""}<ul class="l">${dos.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"");
}
function myths(){return `<h1>${esc(L.mythsTitle)}</h1><p class="mut">${esc(L.mythsIntro)}</p>`+A("myths").map(m=>`<details class="my"><summary>${esc(m.title)}</summary><p>${esc(m.body)}</p>${m.ask?`<p class="mind" style="font-size:17px">${esc(L.askPrefix)}${esc(m.ask)}</p>`:""}</details>`).join("")}
function gains(){return `<h1>${esc(L.gainsTitle)}</h1><p class="mut">${esc(L.gainsIntro)}</p>`+A("gains").map(g=>`<div class="box"><b>${esc(g.title)}</b><p>${esc(g.body)}</p>${g.line?`<div class="mind" style="font-size:16px;margin:0">“${esc(g.line)}”</div>`:""}</div>`).join("")}
function rules(){return `<h1>${esc(L.rulesTitle)}</h1><p class="mut">${esc(L.rulesIntro)}</p>`+A("rules").map((p,n)=>`<div class="pr"><b>${n+1}. ${esc(p.title)}</b>${esc(p.body)}</div>`).join("")}
function learn(){
 const S=subs();if(!S.some(a=>a[0]===sub))sub=S[0][0];
 return (S.length>1?`<div class="seg">`+S.map(a=>`<button data-s="${a[0]}" aria-pressed="${sub===a[0]}">${esc(a[1])}</button>`).join("")+`</div>`:"")+{myths,gains,rules}[sub]();
}
function story(){
 const log=JSON.parse(sg("log","[]")),E=A("stories");
 return (E.length?`<h1>${esc(L.storyTitle)}</h1><p class="mut">${esc(L.storyIntro)}</p>`+E.map(e=>`<details class="my"><summary>${esc(e.title)}</summary><p>${esc(e.body)}</p>${e.line?`<p class="mind" style="font-size:17px">${esc(e.line)}</p>`:""}</details>`).join(""):"")+
 (C.logEnabled?`<h2>${esc(L.logTitle)}</h2><p class="mut">${esc(L.logIntro)}</p>
 <textarea id="ex" placeholder="${esc(L.logPlaceholder)}"></textarea>
 <button class="sit" id="ad" style="justify-content:center;margin-top:8px"><b>${esc(L.logAdd)}</b></button>`+
 log.map((l,n)=>`<div class="box"><span class="mut">${esc(l.d)}</span><p>${esc(l.t)}</p><button class="back" data-del="${n}">${esc(L.logDelete)}</button></div>`).join("")+
 (log.length?`<button class="back" id="cp">${esc(L.logCopy)}</button>`:"")+`<p class="mut">${esc(L.logNote)}</p>`:"");
}
function help(){
 const H=C.help||{};
 return `<h1>${esc(L.helpTitle)}</h1>`+(H.disclaimer?`<div class="warn"><b>${esc(H.disclaimer)}</b></div>`:"")+
 ((H.signals||[]).length?`<h2>${esc(H.signalsTitle||"")}</h2><ul class="l">${H.signals.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"")+
 ((H.contacts||[]).length?`<h2>${esc(H.contactsTitle||"")}</h2>`+H.contacts.map(c=>`<div class="box">${esc(c.label)} ${c.tel?`<a href="tel:${esc(c.tel)}">${esc(c.value)}</a>`:esc(c.value)}${c.note?`<br><span class="mut">${esc(c.note)}</span>`:""}</div>`).join(""):"")+
 (H.closing?`<p class="mut">${esc(H.closing)}</p>`:"");
}
function go(t){tab=t;cur=null;render();scrollTo(0,0)}
function render(){
 if(!tabs().some(a=>a[0]===tab))tab="today";
 app.innerHTML={today,sos,learn,story,help}[tab]();
 nav.innerHTML=tabs().map(a=>`<button data-t="${a[0]}" aria-current="${tab===a[0]}">${ic(a[2],22)}<span>${esc(a[1])}</span></button>`).join("");
 const q=(s,f)=>app.querySelectorAll(s).forEach(f);
 const bk=document.getElementById("bk");if(bk)bk.onclick=()=>{cur=null;render();scrollTo(0,0)};
 q(".sit[data-n]",b=>b.onclick=()=>{cur=+b.dataset.n;render();scrollTo(0,0)});
 q("[data-go]",b=>b.onclick=()=>go(b.dataset.go));
 nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.t));
 q("[data-s]",b=>b.onclick=()=>{sub=b.dataset.s;render()});
 const pl=document.getElementById("pl");if(pl)pl.oninput=()=>ss("pl",pl.value);
 q("input[data-c]",i=>i.onchange=()=>{ss("ck",JSON.stringify([...app.querySelectorAll("input[data-c]")].filter(x=>x.checked).map(x=>+x.dataset.c)))});
 const rs=document.getElementById("rs");if(rs)rs.onclick=()=>{ss("ck","[]");render()};
 const ad=document.getElementById("ad");if(ad)ad.onclick=()=>{const v=document.getElementById("ex").value.trim();if(!v)return;const l=JSON.parse(sg("log","[]"));l.unshift({d:new Date().toLocaleDateString(document.documentElement.lang||"ko"),t:v});ss("log",JSON.stringify(l));render()};
 q("[data-del]",b=>b.onclick=()=>{const l=JSON.parse(sg("log","[]"));l.splice(+b.dataset.del,1);ss("log",JSON.stringify(l));render()});
 const cp=document.getElementById("cp");if(cp)cp.onclick=()=>{const l=JSON.parse(sg("log","[]"));try{navigator.clipboard.writeText(l.map(x=>x.d+"\n"+x.t).join("\n\n")).then(()=>{cp.textContent=L.logCopied})}catch(e){}};
}
render();
// 서비스 워커 등록 (오프라인 사용). https 또는 localhost에서만 동작합니다.
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
